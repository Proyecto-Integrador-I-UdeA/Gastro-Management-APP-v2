name: CI - Build and Test

on:
  push:
    branches: [ develop, feature/* ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
    - name: Install dependencies
      run: npm install
    - name: Build Frontend
      working-directory: ./apps/frontend
      run: npm run build
    - name: Build Backend
      working-directory: ./apps/backend
      run: npm run build  # Asume script en package.json
    - name: Run Tests
      run: npm test  # Ejecuta tests en root o por app